name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    # A hung test must not burn a 6-hour runner. See the ctest --timeout below.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++-13
            cc: gcc-13
            tls_setup: sudo apt-get update && sudo apt-get install -y libssl-dev
          - os: macos-latest
            cxx: clang++
            cc: clang
            # macOS already has OpenSSL via Homebrew (kept under /opt/homebrew); set CMAKE_PREFIX_PATH
            tls_setup: brew install openssl@3 && echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          - os: windows-latest
            cxx: cl
            cc: cl
            tls_setup: echo "Schannel is built into Windows — no setup needed"

    steps:
      - uses: actions/checkout@v4

      - name: Install TLS toolchain
        shell: bash
        run: ${{ matrix.tls_setup }}

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -S . \
                -DCMAKE_BUILD_TYPE=Release \
                -DBEACON_BUILD_TESTS=ON \
                -DBEACON_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        # --timeout bounds each test individually. gtest_discover_tests runs every
        # test in its own process, and a few tracker tests intermittently wedge under
        # that contention — different ones each run, passing in under a second when
        # run alone. Without a per-test bound ctest waits forever and the job dies at
        # GitHub's 6-hour limit instead of failing in two minutes. 120s is ~60x the
        # slowest legitimate test. This bounds the symptom, not the cause: the
        # contention itself is unfixed, and a timeout failure here means that flake,
        # not a regression in the named test. Reproduce with two consecutive local
        # ctest runs and compare which tests time out - the sets differ.
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Verify install rules produce a clean prefix
        shell: bash
        run: |
          cmake --install build --config Release --prefix $PWD/install-test
          # Sanity-check the install layout
          test -f install-test/include/beacon/beacon.hpp        || { echo "MISSING: header"; exit 1; }
          test -f install-test/include/beacon/Version.hpp       || { echo "MISSING: Version.hpp"; exit 1; }
          test -f install-test/lib/cmake/beacon_sdk/beacon_sdk-config.cmake || { echo "MISSING: cmake config"; exit 1; }
          echo "Install layout OK."
